<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="greenCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#01241b"/>
      <stop offset="50%" stop-color="#044e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="40%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Book Body -->
  <rect x="40" y="40" width="520" height="720" rx="24" fill="url(#bookGrad)" stroke="#10b981" stroke-width="3"/>
  <rect x="40" y="40" width="45" height="720" rx="24" fill="url(#greenCardGrad)" opacity="0.7"/>

  <!-- Badge -->
  <rect x="120" y="100" width="170" height="32" rx="16" fill="#10b981"/>
  <text x="205" y="121" fill="#022c22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" text-anchor="middle">EXCLUSIVE E-BOOK</text>

  <!-- Title -->
  <text x="120" y="190" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="34" font-weight="900">THE INTRADAY</text>
  <text x="120" y="235" fill="url(#accentGrad)" font-family="'Outfit', sans-serif" font-size="34" font-weight="900">CHART PATTERNS</text>
  <text x="120" y="280" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="28" font-weight="700">BLUEPRINT</text>

  <line x1="120" y1="310" x2="480" y2="310" stroke="#334155" stroke-width="2"/>

  <!-- Candlestick Visual -->
  <g transform="translate(120, 340)">
    <line x1="40" y1="120" x2="40" y2="20" stroke="#10b981" stroke-width="2"/>
    <rect x="32" y="40" width="16" height="50" rx="2" fill="#10b981"/>
    
    <line x1="90" y1="100" x2="90" y2="30" stroke="#ef4444" stroke-width="2"/>
    <rect x="82" y="50" width="16" height="30" rx="2" fill="#ef4444"/>

    <line x1="140" y1="130" x2="140" y2="10" stroke="#10b981" stroke-width="2"/>
    <rect x="132" y="30" width="16" height="70" rx="2" fill="#10b981"/>

    <line x1="190" y1="110" x2="190" y2="25" stroke="#ef4444" stroke-width="2"/>
    <rect x="182" y="45" width="16" height="35" rx="2" fill="#ef4444"/>

    <line x1="240" y1="140" x2="240" y2="5" stroke="#10b981" stroke-width="2"/>
    <rect x="232" y="20" width="16" height="85" rx="2" fill="#10b981"/>

    <!-- Breakout Trendline -->
    <line x1="20" y1="60" x2="300" y2="10" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4 4"/>
  </g>

  <!-- Bullet points -->
  <g transform="translate(120, 520)">
    <text x="0" y="20" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600">✓ High-Probability Momentum Patterns</text>
    <text x="0" y="55" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600">✓ Support &amp; Resistance Reversal Zones</text>
    <text x="0" y="90" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600">✓ Invalidation &amp; Stop-Loss Rules</text>
  </g>

  <!-- Author Badge -->
  <g transform="translate(120, 660)">
    <rect width="360" height="45" rx="10" fill="url(#greenCardGrad)" stroke="#334155"/>
    <text x="180" y="28" fill="#a7f3d0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle">LOUD STOCK • WORKSHOP INCLUSION</text>
  </g>
</svg>