<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="greenCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#01241b"/>
      <stop offset="50%" stop-color="#044e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#greenCardGrad)" rx="16"/>
  <rect x="20" y="20" width="560" height="40" rx="8" fill="#1e293b"/>
  <circle cx="45" cy="40" r="5" fill="#ef4444"/><circle cx="65" cy="40" r="5" fill="#f59e0b"/><circle cx="85" cy="40" r="5" fill="#10b981"/>
  <text x="110" y="45" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">04. MATHEMATICAL RISK-TO-QUANTITY FORMULA</text>

  <g transform="translate(50, 90)">
    <!-- Formula Box -->
    <rect width="500" height="80" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="250" y="35" fill="#a7f3d0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle">GOLDEN POSITION SIZING FORMULA:</text>
    <text x="250" y="65" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" text-anchor="middle">Quantity = Risk Amount (₹) ÷ Stop Loss (₹)</text>

    <!-- Practical Numerical Example -->
    <g transform="translate(0, 105)">
      <rect width="500" height="155" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="20" y="30" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800">EXAMPLE CALCULATION:</text>
      
      <text x="30" y="65" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">• Predefined Risk per Trade: <tspan fill="#34d399" font-weight="bold">₹1,000</tspan> (1% of 1 Lakh Capital)</text>
      <text x="30" y="95" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">• Stock Entry: ₹500 | Stop-Loss: ₹495 → Distance: <tspan fill="#f87171" font-weight="bold">₹5.00</tspan></text>
      <text x="30" y="125" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">• Quantity to Buy: ₹1,000 ÷ ₹5 = <tspan fill="#fbbf24" font-weight="bold">200 Shares</tspan></text>
      <text x="30" y="148" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Result: If Stop-Loss hits, you lose EXACTLY ₹1,000. No emotional panic.</text>
    </g>
  </g>
</svg>
