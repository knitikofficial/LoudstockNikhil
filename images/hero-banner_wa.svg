<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Official WhatsApp Multi-Stop Green Gradient Background -->
    <linearGradient id="waMainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#054740"/>
      <stop offset="20%" stop-color="#075E54"/>
      <stop offset="50%" stop-color="#0e786b"/>
      <stop offset="78%" stop-color="#128C7E"/>
      <stop offset="100%" stop-color="#25D366"/>
    </linearGradient>

    <!-- WhatsApp Luminous Ambient Glow Overlays -->
    <radialGradient id="waRadialLeft" cx="25%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#25D366" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#128C7E" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#054740" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="waRadialRight" cx="80%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#25D366" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#075E54" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#054740" stop-opacity="0"/>
    </radialGradient>

    <!-- WhatsApp Dark Header Card Gradient -->
    <linearGradient id="waCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075E54" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#054740" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Vibrant WhatsApp Pill Gradient -->
    <linearGradient id="waPillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#25D366"/>
      <stop offset="100%" stop-color="#128C7E"/>
    </linearGradient>

    <linearGradient id="waTextGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="50%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Candlestick Gradients -->
    <linearGradient id="waBullCandle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcf8c6"/>
      <stop offset="40%" stop-color="#25D366"/>
      <stop offset="100%" stop-color="#128C7E"/>
    </linearGradient>

    <linearGradient id="waBearCandle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <filter id="waGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <clipPath id="coachClip">
      <rect x="760" y="30" width="400" height="570" rx="24"/>
    </clipPath>
  </defs>

  <!-- 1. Background WhatsApp Green Gradient -->
  <rect width="1200" height="630" fill="url(#waMainGrad)"/>

  <!-- 2. Ambient Radiant Lighting Overlays -->
  <rect width="1200" height="630" fill="url(#waRadialLeft)" style="mix-blend-mode: screen;"/>
  <rect width="1200" height="630" fill="url(#waRadialRight)" style="mix-blend-mode: screen;"/>

  <!-- 3. Technical Chart Grid Lines (WhatsApp Tint) -->
  <g stroke="#25D366" stroke-width="1" stroke-dasharray="3 4" opacity="0.25">
    <line x1="60" y1="120" x2="800" y2="120"/>
    <line x1="60" y1="200" x2="800" y2="200"/>
    <line x1="60" y1="280" x2="800" y2="280"/>
    <line x1="60" y1="360" x2="800" y2="360"/>
    <line x1="60" y1="440" x2="800" y2="440"/>
    <line x1="60" y1="520" x2="800" y2="520"/>
    
    <line x1="160" y1="70" x2="160" y2="540"/>
    <line x1="300" y1="70" x2="300" y2="540"/>
    <line x1="440" y1="70" x2="440" y2="540"/>
    <line x1="580" y1="70" x2="580" y2="540"/>
    <line x1="720" y1="70" x2="720" y2="540"/>
  </g>

  <!-- 4. Left Section: Header, Title & Subtitle -->
  <g transform="translate(60, 45)">
    <!-- Top Pill: WhatsApp Badge -->
    <g>
      <rect width="320" height="36" rx="18" fill="url(#waPillGrad)" stroke="#ffffff" stroke-width="1.5" filter="url(#waGlow)"/>
      <circle cx="20" cy="18" r="5" fill="#ffffff"/>
      <text x="36" y="23" fill="#054740" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">5,000+ PEOPLE ATTENDED ONLINE</text>
    </g>

    <!-- Main Title in Graphic -->
    <text x="0" y="82" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="40" font-weight="900" letter-spacing="-0.5">THE MOMENTUM INTRADAY</text>
    <text x="0" y="128" fill="url(#waTextGlow)" font-family="'Outfit', sans-serif" font-size="42" font-weight="900" letter-spacing="-0.5" filter="url(#waGlow)">TRADING WORKSHOP</text>

    <!-- Subtext -->
    <text x="0" y="165" fill="#dcf8c6" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">
      Understand the process behind momentum-based intraday trading.
    </text>
  </g>

  <!-- 5. Dynamic Candlestick Sequence on Left with Radiant EMA curve -->
  <g transform="translate(60, 240)">
    <!-- Candle 1 Bull -->
    <line x1="40" y1="110" x2="40" y2="230" stroke="#25D366" stroke-width="2"/>
    <rect x="32" y="130" width="16" height="70" fill="url(#waBullCandle)" rx="3"/>

    <!-- Candle 2 Bear Pullback -->
    <line x1="95" y1="100" x2="95" y2="210" stroke="#fca5a5" stroke-width="2"/>
    <rect x="87" y="120" width="16" height="50" fill="url(#waBearCandle)" rx="3"/>

    <!-- Candle 3 Support Reversal Bull -->
    <line x1="150" y1="70" x2="150" y2="180" stroke="#25D366" stroke-width="2"/>
    <rect x="142" y="90" width="16" height="60" fill="url(#waBullCandle)" rx="3"/>

    <!-- Candle 4 Momentum Expansion Bull -->
    <line x1="205" y1="40" x2="205" y2="150" stroke="#25D366" stroke-width="2"/>
    <rect x="197" y="60" width="16" height="70" fill="url(#waBullCandle)" rx="3"/>

    <!-- Candle 5 Strong Breakout Bull -->
    <line x1="260" y1="10" x2="260" y2="120" stroke="#25D366" stroke-width="3"/>
    <rect x="250" y="25" width="20" height="75" fill="url(#waBullCandle)" rx="3" filter="url(#waGlow)"/>

    <!-- Candle 6 Follow-Through Bull -->
    <line x1="315" y1="-10" x2="315" y2="90" stroke="#dcf8c6" stroke-width="2.5"/>
    <rect x="306" y="5" width="18" height="60" fill="url(#waBullCandle)" rx="3"/>

    <!-- Glowing WhatsApp Green 20 EMA Curve Line -->
    <path d="M 10 190 Q 110 150, 190 100 T 340 5" fill="none" stroke="#25D366" stroke-width="4" filter="url(#waGlow)"/>
    <path d="M 10 215 Q 120 180, 210 135 T 350 40" fill="none" stroke="#dcf8c6" stroke-width="2" stroke-dasharray="5 5" opacity="0.7"/>
  </g>

  <!-- 6. Left Feature Card: 4 Pillars in WhatsApp Dark-Teal Gradient Card -->
  <g transform="translate(60, 420)">
    <rect width="660" height="155" rx="20" fill="url(#waCardGrad)" stroke="#25D366" stroke-width="2" filter="url(#waGlow)"/>

    <!-- Row 1 -->
    <g transform="translate(25, 24)">
      <circle cx="12" cy="12" r="11" fill="#25D366"/>
      <text x="12" y="16" fill="#075E54" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" text-anchor="middle">✓</text>
      <text x="34" y="17" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">1 Complete Intraday Trading Strategy</text>
    </g>

    <g transform="translate(345, 24)">
      <circle cx="12" cy="12" r="11" fill="#25D366"/>
      <text x="12" y="16" fill="#075E54" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" text-anchor="middle">✓</text>
      <text x="34" y="17" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Momentum Stock Selection Logic</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(25, 68)">
      <circle cx="12" cy="12" r="11" fill="#25D366"/>
      <text x="12" y="16" fill="#075E54" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" text-anchor="middle">✓</text>
      <text x="34" y="17" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Price Action &amp; Candlestick Structure</text>
    </g>

    <g transform="translate(345, 68)">
      <circle cx="12" cy="12" r="11" fill="#25D366"/>
      <text x="12" y="16" fill="#075E54" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" text-anchor="middle">✓</text>
      <text x="34" y="17" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Risk-Based Quantity Sizing Formula</text>
    </g>

    <!-- WhatsApp Green Gradient Ticker Bar -->
    <rect x="20" y="108" width="620" height="32" rx="10" fill="#054740" stroke="#128C7E" stroke-width="1"/>
    <text x="330" y="128" fill="#dcf8c6" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">
      25 NOVEMBER • 8:00 PM – 10:00 PM • LIVE ON ZOOM • ₹9 ONLY (REGULAR: ₹1,999)
    </text>
  </g>

  <!-- 7. Right Section: Coach Nikhil Portrait with Glowing WhatsApp Green Frame -->
  <g transform="translate(750, 30)">
    <!-- Vibrant WhatsApp Green Glow Aura Behind Coach -->
    <rect x="-8" y="-8" width="416" height="576" rx="28" fill="#25D366" opacity="0.4" filter="blur(20px)"/>
    <rect x="0" y="0" width="400" height="560" rx="24" fill="#075E54" stroke="#25D366" stroke-width="3"/>

    <!-- Embedded Real Photo of Coach Nikhil -->
    <g clip-path="url(#coachClip)" transform="translate(-760, -30)">
      <image href="images/coach-portrait.jpg" x="760" y="30" width="400" height="560" preserveAspectRatio="xMidYMid slice"/>
    </g>

    <!-- WhatsApp Dark Teal Gradient Overlay on bottom of photo -->
    <rect x="0" y="370" width="400" height="190" rx="24" fill="url(#waCardGrad)" opacity="0.96"/>

    <!-- Coach Info Card in WhatsApp Green Gradient Frame -->
    <g transform="translate(20, 405)">
      <rect width="360" height="135" rx="18" fill="#054740" fill-opacity="0.95" stroke="#25D366" stroke-width="1.5"/>
      
      <text x="180" y="34" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="24" font-weight="900" text-anchor="middle">Nikhil</text>
      
      <text x="180" y="58" fill="#dcf8c6" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.5">
        STOCK MARKET EDUCATOR &amp; TRADING MENTOR
      </text>
      
      <text x="180" y="80" fill="#86efac" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" text-anchor="middle">
        Loud Stock • Practical Education
      </text>
      
      <rect x="75" y="93" width="210" height="26" rx="13" fill="url(#waPillGrad)" stroke="#ffffff" stroke-width="1"/>
      <text x="180" y="110" fill="#054740" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="900" text-anchor="middle" letter-spacing="0.5">
        WORKSHOP HOST &amp; COACH
      </text>
    </g>
  </g>
</svg>