<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="greenCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#01241b"/>
      <stop offset="50%" stop-color="#044e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="40%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#cGrad)"/>

  <!-- Background Candlestick Chart Silhouette -->
  <g opacity="0.15" stroke="#34d399" stroke-width="2">
    <line x1="100" y1="200" x2="100" y2="400"/><rect x="90" y="240" width="20" height="100" fill="#34d399"/>
    <line x1="160" y1="150" x2="160" y2="350"/><rect x="150" y="180" width="20" height="120" fill="#34d399"/>
    <line x1="220" y1="220" x2="220" y2="420"/><rect x="210" y="260" width="20" height="90" fill="#ef4444"/>
    <line x1="600" y1="180" x2="600" y2="380"/><rect x="590" y="210" width="20" height="110" fill="#34d399"/>
    <line x1="660" y1="120" x2="660" y2="320"/><rect x="650" y="150" width="20" height="130" fill="#34d399"/>
    <line x1="720" y1="190" x2="720" y2="390"/><rect x="710" y="230" width="20" height="80" fill="#ef4444"/>
  </g>

  <!-- Glowing Aura -->
  <circle cx="400" cy="380" r="260" fill="#10b981" opacity="0.12" filter="blur(40px)"/>

  <!-- Coach Silhouette / Stylized Avatar -->
  <!-- Shoulders & Suit -->
  <path d="M 220 740 Q 260 520, 340 480 L 400 540 L 460 480 Q 540 520, 580 740 Z" fill="url(#greenCardGrad)" stroke="#334155" stroke-width="4"/>
  
  <!-- Shirt & Tie -->
  <path d="M 360 490 L 400 540 L 440 490 L 420 460 L 380 460 Z" fill="#f8fafc"/>
  <path d="M 393 510 L 407 510 L 412 600 L 400 625 L 388 600 Z" fill="url(#goldAccent)"/>

  <!-- Neck -->
  <rect x="365" y="420" width="70" height="70" rx="10" fill="#e2e8f0"/>

  <!-- Head -->
  <ellipse cx="400" cy="340" rx="95" ry="115" fill="#f1f5f9"/>

  <!-- Hair / Grooming -->
  <path d="M 305 320 Q 330 200, 400 205 Q 470 200, 495 320 Q 450 240, 400 240 Q 350 240, 305 320 Z" fill="#1e293b"/>

  <!-- Modern Glasses -->
  <rect x="330" y="315" width="55" height="35" rx="8" fill="none" stroke="#047857" stroke-width="5"/>
  <rect x="415" y="315" width="55" height="35" rx="8" fill="none" stroke="#047857" stroke-width="5"/>
  <line x1="385" y1="332" x2="415" y2="332" stroke="#047857" stroke-width="5"/>

  <!-- Confident Smile -->
  <path d="M 375 395 Q 400 415, 425 395" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>

  <!-- Badge / Pin on Lapel -->
  <circle cx="320" cy="580" r="14" fill="#047857" stroke="#34d399" stroke-width="2"/>
  <path d="M 314 580 L 318 584 L 327 574" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Overlay Glass Card with Coach Title -->
  <g transform="translate(100, 640)">
    <rect width="600" height="110" rx="20" fill="url(#greenCardGrad)" fill-opacity="0.9" stroke="#10b981" stroke-width="2"/>
    <text x="300" y="45" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="24" font-weight="800" text-anchor="middle">[Coach Name]</text>
    <text x="300" y="75" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600" text-anchor="middle">Stock Market Mentor &amp; Intraday Strategy Coach</text>
    <text x="300" y="96" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" text-anchor="middle">Click to replace with your photo</text>
  </g>
</svg>