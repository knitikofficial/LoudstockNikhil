<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Rich Deep Forest to Vibrant Lime Gradient (#32CD32 & #7CFC00) -->
    <linearGradient id="limeMainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041f06"/>
      <stop offset="25%" stop-color="#09380e"/>
      <stop offset="55%" stop-color="#145719"/>
      <stop offset="82%" stop-color="#1e7a25"/>
      <stop offset="100%" stop-color="#32cd32"/>
    </linearGradient>

    <!-- Electric #7CFC00 Radial Glows -->
    <radialGradient id="limeRadialLeft" cx="25%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#7cfc00" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#32cd32" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#041f06" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="limeRadialRight" cx="82%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#7cfc00" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#145719" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#041f06" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Dark Lime-Green Gradient -->
    <linearGradient id="limeCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b380f" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#041f06" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Vibrant Lime Pill Gradient (#32CD32 -> #7CFC00) -->
    <linearGradient id="limePillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#32cd32"/>
      <stop offset="100%" stop-color="#7cfc00"/>
    </linearGradient>

    <linearGradient id="limeTextGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7cfc00"/>
      <stop offset="45%" stop-color="#adfb60"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Candlestick Gradients (#7CFC00 & #32CD32) -->
    <linearGradient id="limeBullCandle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e5fed0"/>
      <stop offset="40%" stop-color="#7cfc00"/>
      <stop offset="100%" stop-color="#32cd32"/>
    </linearGradient>

    <linearGradient id="bearCandle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <filter id="limeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <clipPath id="coachClip">
      <rect x="760" y="30" width="400" height="570" rx="24"/>
    </clipPath>
  </defs>

  <!-- 1. Background Gradient -->
  <rect width="1200" height="630" fill="url(#limeMainGrad)"/>

  <!-- 2. Ambient Radiant Lighting Overlays -->
  <rect width="1200" height="630" fill="url(#limeRadialLeft)" style="mix-blend-mode: screen;"/>
  <rect width="1200" height="630" fill="url(#limeRadialRight)" style="mix-blend-mode: screen;"/>

  <!-- 3. Technical Chart Grid Lines (#7CFC00 Tint) -->
  <g stroke="#7cfc00" stroke-width="1" stroke-dasharray="3 4" opacity="0.25">
    <line x1="60" y1="120" x2="800" y2="120"/>
    <line x1="60" y1="200" x2="800" y2="200"/>
    <line x1="60" y1="280" x2="800" y2="280"/>
    <line x1="60" y1="360" x2="800" y2="360"/>
    <line x1="60" y1="440" x2="800" y2="440"/>
    <line x1="60" y1="520" x2="800" y2="520"/>
    
    <line x1="160" y1="70" x2="160" y2="540"/>
    <line x1="300" y1="70" x2="300" y2="540"/>
    <line x1="440" y1="70" x2="440" y2="540"/>
    <line x1="580" y1="70" x2="580" y2="540"/>
    <line x1="720" y1="70" x2="720" y2="540"/>
  </g>

  <!-- 4. Left Section: Header, Title & Subtitle -->
  <g transform="translate(60, 45)">
    <!-- Top Pill: 5,000+ Attended (#7CFC00 pill) -->
    <g>
      <rect width="320" height="36" rx="18" fill="url(#limePillGrad)" stroke="#ffffff" stroke-width="1.5" filter="url(#limeGlow)"/>
      <circle cx="20" cy="18" r="5" fill="#041f06"/>
      <text x="36" y="23" fill="#041f06" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">5,000+ PEOPLE ATTENDED ONLINE</text>
    </g>

    <!-- Main Title in Graphic -->
    <text x="0" y="82" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="40" font-weight="900" letter-spacing="-0.5">THE MOMENTUM INTRADAY</text>
    <text x="0" y="128" fill="url(#limeTextGlow)" font-family="'Outfit', sans-serif" font-size="42" font-weight="900" letter-spacing="-0.5" filter="url(#limeGlow)">TRADING WORKSHOP</text>

    <!-- Subtext -->
    <text x="0" y="165" fill="#cefd9d" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">
      Understand the process behind momentum-based intraday trading.
    </text>
  </g>

  <!-- 5. Dynamic Candlestick Sequence with Radiant #7CFC00 EMA curve -->
  <g transform="translate(60, 240)">
    <!-- Candle 1 Bull -->
    <line x1="40" y1="110" x2="40" y2="230" stroke="#7cfc00" stroke-width="2"/>
    <rect x="32" y="130" width="16" height="70" fill="url(#limeBullCandle)" rx="3"/>

    <!-- Candle 2 Bear Pullback -->
    <line x1="95" y1="100" x2="95" y2="210" stroke="#fca5a5" stroke-width="2"/>
    <rect x="87" y="120" width="16" height="50" fill="url(#bearCandle)" rx="3"/>

    <!-- Candle 3 Support Reversal Bull -->
    <line x1="150" y1="70" x2="150" y2="180" stroke="#7cfc00" stroke-width="2"/>
    <rect x="142" y="90" width="16" height="60" fill="url(#limeBullCandle)" rx="3"/>

    <!-- Candle 4 Momentum Expansion Bull -->
    <line x1="205" y1="40" x2="205" y2="150" stroke="#7cfc00" stroke-width="2"/>
    <rect x="197" y="60" width="16" height="70" fill="url(#limeBullCandle)" rx="3"/>

    <!-- Candle 5 Strong Breakout Bull (#7CFC00) -->
    <line x1="260" y1="10" x2="260" y2="120" stroke="#7cfc00" stroke-width="3"/>
    <rect x="250" y="25" width="20" height="75" fill="url(#limeBullCandle)" rx="3" filter="url(#limeGlow)"/>

    <!-- Candle 6 Follow-Through Bull -->
    <line x1="315" y1="-10" x2="315" y2="90" stroke="#e5fed0" stroke-width="2.5"/>
    <rect x="306" y="5" width="18" height="60" fill="url(#limeBullCandle)" rx="3"/>

    <!-- Glowing Electric Lime 20 EMA Curve Line (#7CFC00) -->
    <path d="M 10 190 Q 110 150, 190 100 T 340 5" fill="none" stroke="#7cfc00" stroke-width="4" filter="url(#limeGlow)"/>
    <path d="M 10 215 Q 120 180, 210 135 T 350 40" fill="none" stroke="#cefd9d" stroke-width="2" stroke-dasharray="5 5" opacity="0.7"/>
  </g>

  <!-- 6. Left Feature Card: 4 Pillars in Lime-Green Gradient Card -->
  <g transform="translate(60, 420)">
    <rect width="660" height="155" rx="20" fill="url(#limeCardGrad)" stroke="#7cfc00" stroke-width="2" filter="url(#limeGlow)"/>

    <!-- Row 1 -->
    <g transform="translate(25, 24)">
      <circle cx="12" cy="12" r="11" fill="#7cfc00"/>
      <text x="12" y="16" fill="#041f06" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" text-anchor="middle">✓</text>
      <text x="34" y="17" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">1 Complete Intraday Trading Strategy</text>
    </g>

    <g transform="translate(345, 24)">
      <circle cx="12" cy="12" r="11" fill="#7cfc00"/>
      <text x="12" y="16" fill="#041f06" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" text-anchor="middle">✓</text>
      <text x="34" y="17" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Momentum Stock Selection Logic</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(25, 68)">
      <circle cx="12" cy="12" r="11" fill="#7cfc00"/>
      <text x="12" y="16" fill="#041f06" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" text-anchor="middle">✓</text>
      <text x="34" y="17" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Price Action &amp; Candlestick Structure</text>
    </g>

    <g transform="translate(345, 68)">
      <circle cx="12" cy="12" r="11" fill="#7cfc00"/>
      <text x="12" y="16" fill="#041f06" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" text-anchor="middle">✓</text>
      <text x="34" y="17" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Risk-Based Quantity Sizing Formula</text>
    </g>

    <!-- Lime Gradient Ticker Bar -->
    <rect x="20" y="108" width="620" height="32" rx="10" fill="#041f06" stroke="#1b8a1c" stroke-width="1"/>
    <text x="330" y="128" fill="#cefd9d" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">
      25 NOVEMBER • 8:00 PM – 10:00 PM • LIVE ON ZOOM • ₹9 ONLY (REGULAR: ₹1,999)
    </text>
  </g>

  <!-- 7. Right Section: Coach Nikhil Portrait with Glowing Lime Frame (#7CFC00) -->
  <g transform="translate(750, 30)">
    <!-- Electric #7CFC00 Glow Aura Behind Coach -->
    <rect x="-8" y="-8" width="416" height="576" rx="28" fill="#7cfc00" opacity="0.45" filter="blur(22px)"/>
    <rect x="0" y="0" width="400" height="560" rx="24" fill="#041f06" stroke="#7cfc00" stroke-width="3"/>

    <!-- Embedded Real Photo of Coach Nikhil -->
    <g clip-path="url(#coachClip)" transform="translate(-760, -30)">
      <image href="images/coach-portrait.jpg" x="760" y="30" width="400" height="560" preserveAspectRatio="xMidYMid slice"/>
    </g>

    <!-- Dark Lime Gradient Overlay on bottom of photo -->
    <rect x="0" y="370" width="400" height="190" rx="24" fill="url(#limeCardGrad)" opacity="0.96"/>

    <!-- Coach Info Card in Electric Lime Frame -->
    <g transform="translate(20, 405)">
      <rect width="360" height="135" rx="18" fill="#041f06" fill-opacity="0.95" stroke="#7cfc00" stroke-width="1.5"/>
      
      <text x="180" y="34" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="24" font-weight="900" text-anchor="middle">Nikhil</text>
      
      <text x="180" y="58" fill="#cefd9d" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.5">
        STOCK MARKET EDUCATOR &amp; TRADING MENTOR
      </text>
      
      <text x="180" y="80" fill="#adfb60" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" text-anchor="middle">
        Loud Stock • Practical Education
      </text>
      
      <rect x="75" y="93" width="210" height="26" rx="13" fill="url(#limePillGrad)" stroke="#ffffff" stroke-width="1"/>
      <text x="180" y="110" fill="#041f06" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="900" text-anchor="middle" letter-spacing="0.5">
        WORKSHOP HOST &amp; COACH
      </text>
    </g>
  </g>
</svg>