  </defs>
  <rect width="600" height="400" fill="url(#greenCardGrad)" rx="16"/>
  <rect x="20" y="20" width="560" height="40" rx="8" fill="#1e293b"/>
  <circle cx="45" cy="40" r="5" fill="#ef4444"/><circle cx="65" cy="40" r="5" fill="#f59e0b"/><circle cx="85" cy="40" r="5" fill="#10b981"/>
  <text x="110" y="45" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">01. COMPLETE STRATEGY EXECUTION MODEL</text>
  
  <!-- Flow steps -->
  <g transform="translate(40, 90)">
